[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "mcp-faultlab"
version = "0.1.0"
description = "Deterministic failure testing at an agent's tool boundary"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Giorgio Sarno"}]
dependencies = []

[project.scripts]
mcp-faultlab = "mcp_faultlab.cli:main"

[project.optional-dependencies]
compatibility = ["mcp==1.30.0"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_faultlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E501"]
"src/mcp_faultlab/report.py" = ["E501"]
